What it says: It extends to the whole of India. The rules in this law apply to every single part and state of India.

The Core Definitions: 

Invention [Section 2(1)(j)]: A brand-new product or process. It must do two things: it must feature an innovative step forward and it must have a practical use in the real world. 

New Invention [Section 2(1)(l)]: Technology that has never been published in a document or publicly used anywhere in the world before. It cannot already be common public knowledge.

Patent [Section 2(1)(m)]: The official certificate of exclusive rights granted by the government for an invention under this specific law. 

Patentee [Section 2(1)(p)]: The person currently recorded in the official government registry as the owner of the patent.

       `Section 3 of patent act: 

Section 3 of the Indian Patents Act, 1970 explains what cannot be patented in India. Even if an idea is completely new and useful, the government will refuse to grant a patent if it falls under any of the categories listed in this section. The primary goal of this rule is to protect public health, environment, and traditional knowledge from being unfairly locked away by private companies. 

Here is a simplified summary of what you cannot patent under Section 3: [1]

"7": {

      text: [
        `Section 7 of the Indian Patents Act, 1970 explains the rules for how you must format and submit a patent application. 

 One invention per application: Each application can only cover one specific invention. 

 Official form and location: You must use the official format (Form 1) and submit it to the Indian Patent Office. 

 International applications: Global filings made via the Patent Cooperation Treaty (PCT) that include India are counted as Indian applications. 

 Proof of rights: If someone else is applying on behalf of the creator (like a company or an buyer), they must submit legal proof of their right to apply. 

Section 7(1) — The Basic Rule
Every application must be submitted using the correct form to the Patent Office. It can only be for one invention. You cannot bundle multiple, unrelated ideas into a single application. 

Section 7(1A) & 7(1B) — International Apps
If you file an international application through the Patent Cooperation Treaty (PCT) and choose India as one of your target countries, it will be treated exactly like a normal Indian application. The official international filing date becomes your official filing date in India. 

Section 7(2) — Proof of Ownership
If you are not the actual inventor but have bought or assigned the rights to the invention, you must prove it. You must provide official proof (like an assignment deed) when you apply, or within a specific legal timeframe. 

Section 7(3) — Declaration of Truth
The application must state clearly that you have the invention in your possession. It must name the true and original inventor. If the applicant and the inventor are different people, the applicant must sign a declaration confirming that they believe the named person is indeed the original creator. 

Section 7(4) — Technical Documents
Every standard application must include a detailed description of the invention. This is submitted as a provisional specification (a temporary rough draft) or a complete specification (the final detailed breakdown).`

        `Section 8 of patent act: 

Section 8 of the Indian Patents Act, 1970 mandates that any person applying for a patent in India must completely disclose all related patent applications filed in foreign countries for the same or a very similar invention. This law forces transparency so the Indian Patent Office can check how other nations are treating the same invention before giving it protection in India. It is divided into two primary sub-sections that outline the applicant's duties and the government's power. 

Section 8(1): The Duty of Statement and Undertaking 

This sub-section says that if you are applying for an Indian patent, and you (or someone related to you) are also trying to get a patent for the same invention in another country, you have a strict legal duty to tell the Indian Patent Office. You must do this by filing a specific document known as Form 3 either when you apply or within a set timeframe. This rule breaks down into two specific parts: 

Section 8(1)(a): You must give a clear, detailed statement listing every foreign country where you filed a similar patent application, along with key details like application numbers, filing dates, and their current status. 

Section 8(1)(b): You must sign an ongoing promise (an undertaking) stating that you will continuously update the Indian Patent Office about any new, similar foreign applications you file in the future, keeping them informed all the way until your Indian patent is officially granted or rejected. 

Section 8(2): The Controller’s Power to Ask for More Details


This sub-section gives the Controller (the head of the Indian Patent Office) the power to step in at any point before your patent is approved or refused. Even if you already provided information under the first part, the Controller can demand that you hand over precise, extra data about how your foreign application is being processed. This typically means you must share specific foreign documents, such as search reports, official objections, lists of rejected claims, or approval updates from international patent offices.`

This section explains when and how an inventor must file their detailed invention documents (specifications) with the patent office. 

Subsection 1: Filing the Complete Specification 

  Provisional First: You can file a quick, initial summary called a Provisional Specification first. 

  12-Month Deadline: You must file the detailed, final version called a Complete Specification within 12 months of that first filing. 

  Consequence: If you miss this 12-month deadline, the patent office will cancel your application. 



Subsection 2: Multiple Provisional Applications 

 Combining Ideas: If you file multiple provisional applications for closely related inventions, you can combine them. 

 Single Final Document: You can file one single Complete Specification for all of them. 

 Time Limit: You must file this combined document within 12 months from the date of the very first provisional application you filed. 

Subsection 3: Treating a Complete Specification as Provisional. 

 The Request: If you file a Complete Specification first, you can ask the patent office to change its status. 

 Downgrade: You can request to treat it as a Provisional Specification instead. 

 Time Limit: You must make this request within 12 months from the date you filed that original application. 


Subsection 4: Splitting or Replacing Applications 

 Post-dating: If you file a Complete Specification, the Controller (patent officer) can allow you to cancel it. 

 New Start Date: You can instead file a fresh Complete Specification later.

        `Section 10 of the Indian Patents Act, 1970 outlines exactly what information must be included in a patent document (specification). 

Section 10(1) – The Title 

  Every patent application must include a written description of the invention. 

  It must start with a clear and direct title that explains what the invention is. 

Section 10(2) – The Drawings

"11": {
      title: "Prority dates of claims of complete specification ",
      text: [
        `Based on the Indian Patents Act, 1970, Section 11 is titled "Priority dates of claims of a complete specification".

This section decides the exact "birth date" (Priority Date) of every specific idea or feature you claim in your final patent application. This date is crucial because anyone who tries to copy your idea after this date cannot stop your patent, and any similar ideas made public after this date cannot be used by the patent office to reject your application.

An easy-to-understand explanation of every subsection of Section 11:

Section 11(1): Every Claim Gets a Date

Law: Every individual claim in your final patent paperwork must have a priority date.

Explanation: If your patent lists 5 different features (claims), the government will look at and assign a specific safety date to each of those 5 features individually.

Section 11(2): Simple, Single Applications

Law: If you filed one simple application with a provisional document first, or just went straight to a final document, the date you handed it in is your priority date.

Simple Explanation:

If you filed a Provisional (rough/early) document first, and your final paperwork is based on it, the priority date is the day you filed that first provisional document.

If you skipped the provisional and just filed a Complete (final) document, your priority date is the day you filed that final document.


Section 11(3): Merging Multiple Applications.

Law: If you filed two or more early applications with different parts of an idea, and later combined them into one final document, the priority date for each part is the date of the specific early document where that part was first explained.

Explanation: Imagine you filed a rough idea in January and a second related idea in March. In December, you combined them into one big final patent application. The parts from January keep their January date, and the new parts from March keep their March date.


Section 11(3A): Foreign or Convention Priority

Law: If you previously filed the same patent application in another country (or an earlier basic application in India) within the last 12 months, you can claim that original date.

Explanation: If you officially applied for a patent in the USA or India 6 months ago, and you are expanding it now, the government lets you backdate your current Indian application to that original date from 6 months ago, as long as the idea was fully explained there.

Section 11(4): Split / Divisional Applications

Law: If you originally filed a big application but later had to split a piece of it off into a separate, new application (called a divisional application), the new application keeps the original date from the big application.

Explanation: If your main application was filed in 2024 and you split it into a second application in 2026, the second application still gets credited with the original 2024 date, so you do not lose your place in line.


Section 11(5): If an Idea Has Multiple Overlapping Dates

Law: If a specific feature or claim accidentally qualifies for two or more different priority dates under this rule, it will automatically receive the earliest date.

Explanation: The law always favors the inventor by giving you the oldest possible date to ensure your idea is protected as early as possible.

Section 11(6): The Catch-All Rule

Law: If none of the situations in subsections 2, 3, 3A, 4, or 5 apply to your claim, its priority date is simply the day you filed the final, complete specification.

Explanation: If your idea is completely new and wasn't mentioned in any earlier rough drafts or foreign applications, its official date is the exact day you handed in your final paperwork to the patent office.

Section 11(7): Post-Dating and Ante-Dating adjustments

Law: If the Patent Controller officially orders your application date to be pushed forward (post-dated) or pulled backward (ante-dated) under other legal sections, that newly adjusted date is used as your filing date for all priority calculations.

Explanation: If the patent office officially changes the official receipt date of your paperwork for administrative or legal corrections, all your priority dates adjust to match that new official date.`

  // Helper function to build paragraph layout for large blocks of text
  function formatLegalText(title, paragraphsArray, highlightKeyword = '') {
    let htmlContent = `<h3>${title}</h3>`;
    paragraphsArray.forEach(pText => {
      let styledText = pText;
      if (highlightKeyword) {
        const regex = new RegExp(`(${highlightKeyword})`, 'gi');
        styledText = pText.replace(regex, '<mark style="background-color: #ffeb3b; color: #000;">$1</mark>');
      }
      htmlContent += `<div class="legal-paragraph">${styledText}</div>`;
    });
    return htmlContent;
  }

  // Search Logic
  function showSearchResult() {
    const section = document.getElementById('sectionInput').value.trim();
    const keyword = document.getElementById('keywordInput').value.trim().toLowerCase();
    const resultBox = document.getElementById('searchResultBox');

    resultBox.innerHTML = '';

    if (section && keyword) {
      resultBox.innerHTML = '<span style="color: #d32f2f; font-weight: bold;">⚠️ Please search using only one field: Section OR Keyword.</span>';
      return;
    }

    if (section) {
      if (patentActData[section]) {
        const entry = patentActData[section];
        resultBox.innerHTML = formatLegalText(`Section ${section} - ${entry.title}`, entry.text);
      } else {
        resultBox.innerHTML = '❌ No formal legal records found matching that statutory section number.';
      }
    } else if (keyword) {
      let combinedHTML = '';
      for (let key in patentActData) {
        const entry = patentActData[key];
        const titleMatch = entry.title.toLowerCase().includes(keyword);
        const textMatch = entry.text.some(p => p.toLowerCase().includes(keyword));

        if (titleMatch || textMatch) {
          combinedHTML += formatLegalText(`Section ${key} - ${entry.title}`, entry.text, keyword) + '<hr style="border:0; border-top: 1px dashed #ccc; margin: 15px 0;">';
        }
      }
      resultBox.innerHTML = combinedHTML || '❌ No matching legal clauses or references found for that keyword query.';
    } else {
      resultBox.innerHTML = 'ℹ️ Please enter either a target section number or an explicit keyword phrase.';
    }
  }
