<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Indian Patents Act, 1970 </title>
  <style>
    :root {
      --primary-color: #0f172a;
      --secondary-color: #2563eb;
      --accent-color: #3b82f6;
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-color: #334155;
      --heading-color: #1e293b;
      --border-color: #cbd5e1;
      --highlight-color: #fef08a;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .hidden {
      display: none !important;
    }
    .container {
      width: 100%;
      max-width: 1000px;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
      padding: 40px;
      margin-top: 20px;
      box-sizing: border-box;
    }
    .title {
      font-size: 28px;
      font-weight: 800;
      color: var(--primary-color);
      text-align: center;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .subtitle {
      font-size: 15px;
      color: #64748b;
      text-align: center;
      margin-top: 0;
      margin-bottom: 35px;
    }
    .form-group {
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--heading-color);
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      font-size: 16px;
      transition: all 0.2s ease-in-out;
      box-sizing: border-box;
      background-color: #f8fafc;
    }
    input[type="text"]:focus, input[type="password"]:focus {
      outline: none;
      border-color: var(--secondary-color);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
      background-color: #ffffff;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 30px;
      flex-wrap: wrap;
    }
    button {
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 600;
      background-color: var(--secondary-color);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button:hover {
      background-color: #1d4ed8;
      transform: translateY(-1px);
    }
    button.secondary {
      background-color: #64748b;
    }
    button.secondary:hover {
      background-color: #475569;
    }
    .or-divider {
      text-align: center;
      font-weight: bold;
      margin: 30px 0;
      color: #94a3b8;
      position: relative;
    }
    .or-divider::before, .or-divider::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 42%;
      height: 1px;
      background: var(--border-color);
    }
    .or-divider::before { left: 0; }
    .or-divider::after { right: 0; }
    
    .result-box {
      margin-top: 30px;
      background: #fafafa;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      max-height: 600px;
      overflow-y: auto;
    }
    .legal-item {
      margin-bottom: 35px;
      padding-bottom: 25px;
      border-bottom: 1px solid var(--border-color);
    }
    .legal-item:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    .section-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--secondary-color);
      margin-top: 0;
      margin-bottom: 12px;
    }
    .section-text {
      font-size: 15px;
      line-height: 1.7;
      text-align: justify;
      color: #334155;
    }
    .example-box {
      background-color: #eff6ff;
      border-left: 4px solid var(--accent-color);
      padding: 16px;
      margin-top: 14px;
      border-radius: 0 8px 8px 0;
      font-size: 14.5px;
    }
    .example-title {
      font-weight: bold;
      color: #1e40af;
      margin-bottom: 6px;
    }
    .badge {
      display: inline-block;
      background-color: #e2e8f0;
      color: #334155;
      font-size: 12px;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 10px;
    }
    #loginError {
      color: #ef4444;
      font-size: 14px;
      text-align: center;
      margin-top: 15px;
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="container">
  
  <!-- LOGIN VIEW -->
  <div id="loginPage" class="card">
    <div class="title">Legal Assistant Portal</div>
    <div class="subtitle">Indian Patents Act, 1970 </div>
    
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Enter username ">
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter password ">
    </div>
    
    <div style="text-align: center;">
      <button onclick="handleLogin()">Unlock Database</button>
    </div>
    <div id="loginError"></div>
  </div>

  <!-- MAIN DATABASE SEARCH VIEW -->
  <div id="searchPage" class="card hidden">
    <div class="title">Statutory Search Hub</div>
    <div class="subtitle">Search 163 Sections of the Indian Patents Act in Plain English with Real-world Examples</div>
    
    <div class="form-group">
      <label for="sectionInput">Search by Section Number</label>
      <input type="text" id="sectionInput" placeholder="Enter precise section number (e.g., 3, 25, 48, 84, 104)">
    </div>
    
    <div class="or-divider">OR</div>
    
    <div class="form-group">
      <label for="keywordInput">Search by Key Concept / Word</label>
      <input type="text" id="keywordInput" placeholder="Enter keyword (e.g., infringement, compulsory, micro-organism, secrecy)">
    </div>
    
    <div class="btn-group">
      <button class="secondary" onclick="goToLogin()">Lock System</button>
      <button onclick="showSearchResult()">Execute Search</button>
      <button class="secondary" onclick="resetSearch()">Clear Form</button>
    </div>
    
    <div id="searchResultBox" class="result-box">
      <span style="color: #64748b;">Awaiting query execution. Enter a targeted section or key phrase above to generate clean explanations and examples.</span>
    </div>
  </div>

</div>

<script>
  // Complete 163-Section Plain English Translation and Example Dataset

    "26": {

    "50": {
      title: "Rights of co-owners of patents",
      text: "Explains that if a patent is owned by multiple people, they each get an equal share and can work the patent for their own profit, but they cannot grant licenses or sell their share without everyone's consent.",
      example: "If Jack and Jill co-own a patent, Jack can manufacture and sell the item himself. However, Jack cannot license the technology to TechCorp for royalty fees unless Jill formally signs the license agreement."
    },
    "51": {
      title: "Power of Controller to give directions to co-owners",
      text: "Gives the Controller authority to step in and resolve disputes between co-owners, including ordering the sale or licensing of the patent if one co-owner is acting unreasonably.",
      example: "If Jill wants to license their patent to help save a failing business, but Jack refuses to sign out of spite, Jill can petition the Controller, who can override Jack's refusal if it is reasonable."
    },
    "52": {
      title: "Grant of patent to true and first inventor where it has been obtained by another in fraud of him",
      text: "If a patent is found to have been obtained through fraud, the court or Controller can order the patent to be revoked and issue a fresh patent to the true, defrauded inventor.",
      example: "If a contractor copies your prototype and files a patent on it, when you prove the fraud in court, the contractor's patent is cancelled, and a new patent is issued in your name with their original filing date."
    },
    "53": {
      title: "Term of patent",
      text: "Establishes that the maximum lifespan of all patents in India is exactly 20 years from the original filing date, subject to the payment of annual renewal fees.",
      example: "If you file a patent on June 1, 2024, your patent protection will permanently expire on June 1, 2044, after which anyone in the world is free to copy and sell your technology."
    },
    "54": {
      title: "Patents of addition",
      text: "Allows an inventor to apply for a 'patent of addition' for modifications or improvements made to their primary patented invention, saving them from paying separate renewal fees.",
      example: "You patent a smart toaster. A year later, you design an improved thermal sensor for it. Instead of filing a costly new patent, you file a 'patent of addition' connected to your main toaster patent."
    },
    "55": {
      title: "Term of patents of addition",
      text: "States that a patent of addition expires on the exact same day as the main patent, and if the main patent is revoked, the patent of addition can be converted into an independent patent.",
      example: "If your main patent for a phone battery has 12 years left, your new patent of addition for an improved battery charger will also expire in exactly 12 years, aligning with the parent patent."
    },
    "56": {
      title: "Validity of patents of addition",
      text: "Declares that a patent of addition cannot be challenged or declared invalid simply because the modification it protects lacks an 'inventive step' over the original patent.",
      example: "A competitor cannot sue to cancel your patent of addition on the grounds that your minor modification is too obvious when compared to your own primary patented invention."
    },
    "57": {
      title: "Amendment of application and specification before Controller",
      text: "Allows an applicant to ask the Controller for permission to amend their patent application, specifications, or drawings to correct mistakes or clarify technical points.",
      example: "You realize there is a typographical error in your chemical formula list. You file 'Form 13' to request the Controller to let you edit the text before the final grant is issued."
    },
    "58": {
      title: "Amendment of specification before Appellate Board or High Court",
      text: "Permits a patent owner to amend their patent specifications directly during infringement or revocation proceedings in front of the High Court to save the patent from being invalidated.",
      example: "During a lawsuit, a rival shows your claim is too broad. You request the High Court to let you narrow down your claim text on the spot, preserving your patent's validity in court."
    },
    "59": {
      title: "Supplementary provisions as to amendment of application or specification",
      text: "Establishes the strict rule that no amendment will be allowed if it introduces completely new technical details or makes the legal claims broader than what was originally filed.",
      example: "If you applied for a patent on a wired charger, you cannot amend your application to include wireless induction charging, as this would introduce completely new technology not in your original draft."
    },
    "60": {
      title: "Applications for restoration of lapsed patents",
      text: "Provides a mechanism for restoring a patent that expired because the owner missed paying the annual renewal fee, provided they apply within 18 months and prove the delay was unintentional.",
      example: "Your patent lapsed because your accountant forgot to pay the renewal fee while you were hospitalized. You have 18 months to file 'Form 15' to explain the situation and revive your patent."
    },
    "61": {
      title: "Procedure for disposal of applications for restoration of lapsed patents",
      text: "Directs how the Controller must process restoration requests, including publishing the request so the public can file objections if they believe the patent should not be revived.",
      example: "When you apply to restore your lapsed battery patent, the Controller advertises it in the journal. A competitor who started building the battery can oppose, arguing you let it lapse on purpose."
    },
    "62": {
      title: "Rights of patentees of lapsed patents which have been restored",
      text: "Protects third parties who began using the patented technology during the gap period when the patent had lapsed and was officially inactive, preventing them from being sued for infringement.",
      example: "While your patent was inactive for 10 months, a factory produced 5,000 units of your device. Once your patent is restored, you cannot sue them for infringement for those specific 5,000 units made during the lapse."
    },
    "63": {
      title: "Surrender of patents",
      text: "Allows a patent owner to voluntarily offer to surrender their patent back to the government at any time, which is published to let any interested parties oppose the surrender.",
      example: "A company decides to open-source its green tech. They voluntarily surrender their patent so that the public can use the technology globally without royalty fees."
    },
    "64": {
      title: "Revocation of patents",
      text: "Lists all the legal grounds (such as lack of novelty, obviousness, or fraud) upon which a patent can be officially cancelled or revoked by the High Court or through counter-claims.",
      example: "A tech firm sues you for patent infringement. In response, your lawyers file a counter-claim under Section 64, proving your invention was already described in a 2015 public science journal, invalidating your patent."
    },
    "65": {
      title: "Revocation of patent or amendment of complete specification on directions from Government in cases relating to atomic energy",
      text: "Empowers the Central Government to direct the Controller to immediately revoke any patent if it is found to have strayed into forbidden atomic energy or national security sectors.",
      example: "If the government realizes your patented particle sensor is being modified to trigger nuclear weapons, they will command the Controller to revoke your patent immediately under Section 65."
    },
    "66": {
      title: "Revocation of patent in public interest",
      text: "Gives the Central Government the absolute power to revoke any patent if they believe the patent or the way it is being used is mischievous to the state or highly prejudicial to the public.",
      example: "During a public health crisis, if a company refuses to license a critical vaccine and keeps production dangerously low, the government can revoke their patent in the public interest."
    },
    "67": {
      title: "Register of patents and particulars to be entered therein",
      text: "Mandates that the Patent Office maintain an official 'Register of Patents' containing details of all active patents, names of owners, addresses, assignments, licenses, and renewals.",
      example: "If you buy a patent from an inventor, you must ensure your name is entered in the Register of Patents to make your legal ownership official and visible to the public."
    },
    "68": {
      title: "Assignments, etc., not to be valid unless in writing and duly executed",
      text: "Declares that any sale, transfer, mortgage, or licensing of a patent is legally invalid unless it is recorded in a written agreement and signed by all parties.",
      example: "A verbal agreement to sell your patent to a partner for 10 lakh rupees has no legal weight. If there is no signed, written contract, you remain the sole owner under Section 68."
    },
    "69": {
      title: "Registration of assignments, transmissions, etc.",
      text: "Requires anyone who purchases or acquires a share/license in a patent to formally register their legal interest with the Controller to establish public, enforceable ownership.",
      example: "After signing a written contract to purchase a patent, you must file 'Form 16' with the Patent Office so they update the public register to reflect you as the new owner."
    },
    "70": {
      title: "Power of registered grantee or proprietor to deal with patent",
      text: "Confirms that the registered owner of a patent has the full legal power to assign, sell, or license the patent, subject to any existing rights recorded in the public register.",
      example: "If you are registered as the sole owner of a drone patent, you have the absolute legal power under Section 70 to sell exclusive manufacturing licenses to a commercial toy manufacturer."
    },
    "71": {
      title: "Rectification of register by High Court",
      text: "Allows any aggrieved person to apply to the High Court to correct errors, omissions, or wrongful entries made in the official Register of Patents.",
      example: "If a competitor fraudulently registers themselves as a co-owner of your patent, you can apply to the High Court to have their name deleted from the register."
    },
    "72": {
      title: "Register to be open for inspection",
      text: "Declares that the Register of Patents must be open to the public for physical inspection, and certified copies of any entry can be purchased.",
      example: "An investor wants to verify that you own a patent before funding your company. They can pay a small fee and inspect the registry to see if there are any loans against your patent."
    },
    "73": {
      title: "Controller and other officers",
      text: "States that the Controller General of Patents, Designs and Trade Marks is the supreme administrative officer, and the government can appoint other officers to assist.",
      example: "The Controller General oversees the administration of patent branch offices in Mumbai, Chennai, Kolkata, and New Delhi, ensuring unified operational standards."
    },
    "74": {
      title: "Patent office and its branches",
      text: "Establishes the head Patent Office and permits the Central Government to set up branch offices across India to manage regional patent filings.",
      example: "An inventor based in Tamil Nadu can submit their physical applications and attend hearings at the regional branch of the Patent Office located in Chennai."
    },
    "75": {
      title: "Restriction on employees of patent office as to right or interest in patents",
      text: "Strictly forbids any officer or employee working at the Patent Office from applying for, buying, or holding any interest in a patent during their employment.",
      example: "A patent examiner cannot file a patent application for their own personal invention or buy shares in a private patent to avoid conflicts of interest."
    },
    "76": {
      title: "Officers and employees not to furnish information, etc.",
      text: "Prohibits Patent Office employees from writing reports or providing unauthorized private information about pending, unpublished patent applications.",
      example: "An administrative clerk at the Patent Office cannot leak confidential blueprints of a startup's pending drone system to a rival tech company."
    },
    "77": {
      title: "Controller to have certain powers of a civil court",
      text: "Grants the Controller the powers of a Civil Court, including summoning witnesses, demanding documents, receiving evidence under oath, and issuing official costs.",
      example: "If there is a dispute during an opposition hearing, the Controller can summon a scientific expert to testify under oath, just like a judge in a court of law."
    },
    "78": {
      title: "Powers of Controller to correct clerical errors, etc.",
      text: "Allows the Controller to correct minor clerical mistakes, typos, or spelling errors in patent documents, specifications, or register entries.",
      example: "If you accidentally typed 'Sodum' instead of 'Sodium' in your patent specification, the Controller can correct this spelling mistake without forcing a complex amendment process."
    },
    "79": {
      title: "Evidence how to be given and powers of Controller in respect thereof",
      text: "Rules that evidence submitted to the Controller should normally be provided via written affidavits, but the Controller can allow oral cross-examinations.",
      example: "Instead of traveling to a hearing, an expert can submit a signed, notarized affidavit outlining their analysis of why a chemical process is novel."
    },
    "80": {
      title: "Exercise of discretionary powers by Controller",
      text: "Requires that the Controller cannot use their discretionary power against an applicant without giving that applicant a fair, reasonable opportunity to be heard.",
      example: "The Controller cannot reject your application due to a minor procedural delay without first scheduling a hearing to let you explain the cause of the delay."
    },
    "81": {
      title: "Disposal by Controller of applications for extension of time",
      text: "Authorizes the Controller to evaluate and approve/reject applications submitted by inventors seeking extensions on statutory timelines.",
      example: "If you need an extra month to submit a document because of a medical emergency, you apply under Section 81, and the Controller reviews whether to grant the extension."
    },
    "82": {
      title: "Definition of 'patented articles' and 'patentee'",
      text: "Clarifies that for the purposes of evaluating whether a patent is being actively manufactured and sold, 'patented article' includes products made under a patented process.",
      example: "If your patent is for a process of pasteurizing milk, the actual pasteurized milk sold in stores is treated as a 'patented article' under this chapter's rules."
    },
    "83": {
      title: "General principles applicable to working of patented inventions",
      text: "Declares the national philosophy of patents: they are granted to encourage local manufacturing and industrial progress, not merely to allow owners to enjoy an import monopoly.",
      example: "A foreign company cannot block local production of a life-saving drug in India by patenting it and only importing small, expensive batches from overseas."
    },
    "84": {
      title: "Compulsory licences",
      text: "Allows third parties to apply for a 'Compulsory License' to manufacture a patented item after 3 years if the patentee fails to make it available at an affordable price, or fails to meet public demand.",
      example: "If a foreign company patents a crucial cancer drug but charges 2 lakh rupees per bottle, an Indian pharma firm can apply for a compulsory license to make generic versions for 5,000 rupees."
    },
    "85": {
      title: "Revocation of patents by the Controller for non-working",
      text: "Permits the Controller to permanently revoke a patent if, after 2 years from granting a compulsory license, the patented invention is still not being manufactured or sold in India.",
      example: "If a compulsory license was granted to make a water filter, but 2 years have passed and the filter is still unavailable, the Controller can cancel the patent entirely under Section 85."
    },
    "86": {
      title: "Power of Controller to adjourn applications for compulsory licences, etc., in certain cases",
      text: "Allows the Controller to delay or adjourn a compulsory license application for up to 12 months if the patentee proves they have a good reason for not starting local manufacture yet.",
      example: "If a company shows that a massive flood destroyed their factory and delayed their manufacturing launch, the Controller can grant them a 12-month grace period before licensing it to rivals."
    },
    "87": {
      title: "Procedure for dealing with applications under sections 84 and 85",
      text: "Sets out the legal process for compulsory licensing applications, including advertising the application to allow the patentee to file a formal opposition.",
      example: "When an Indian company files for a compulsory license on a drug, the Controller publishes the request so the original patent holder can file a counter-argument."
    },
    "88": {
      title: "Powers of Controller in granting compulsory licences",
      text: "Empowers the Controller to decide who gets a compulsory license, set the royalty rates, and establish the terms of manufacture and distribution.",
      example: "The Controller can grant a license to two different generic companies to ensure healthy competition and lower market prices for a patented medical device."
    },
    "89": {
      title: "General purposes for granting compulsory licences",
      text: "Directs the Controller to ensure that compulsory licenses are granted to make the invention widely available, protect domestic industries, and keep prices reasonable.",
      example: "The Controller must design the terms of a compulsory license so that patients in India get access to cheap diagnostics while the inventor still receives a fair royalty."
    },
    "90": {
      title: "Terms and conditions of compulsory licences",
      text: "Lists mandatory terms for compulsory licenses, such as ensuring the license is non-exclusive, non-transferable, and primarily serves the domestic Indian market.",
      example: "A generic company granted a compulsory license to make heart medication in India is legally barred from exporting 90% of those drugs to Canada for higher profits."
    },
    "91": {
      title: "Licensing of related patents",
      text: "Enables an inventor holding a patent on an improvement to demand a license on the original base patent if they cannot work their new invention without it.",
      example: "You patent an advanced safety brake for a specific train engine. Since you cannot sell your brake without using their patented engine, you can request a cross-license under Section 91."
    },
    "92": {
      title: "Special provision for compulsory licences on notifications by Central Government",
      text: "Allows the Central Government to declare a national emergency or extreme urgency, enabling the Controller to grant compulsory licenses immediately (e.g., for life-saving drugs).",
      example: "In the event of a sudden global pandemic, the health ministry can issue a public notification under Section 92, allowing immediate generic manufacture of a patented viral treatment."
    },
    "92A": {
      title: "Compulsory licence for export of patented pharmaceutical products in certain exceptional circumstances",
      text: "Enables Indian generic drug manufacturers to secure a compulsory license to manufacture and export life-saving medicines to countries facing public health crises.",
      example: "If a developing country in Africa lacks factories to make a patented malaria drug, an Indian manufacturer can get a license under 92A to make and export the drug to them."
    },
    "93": {
      title: "Order for licence to operate as a deed between parties concerned",
      text: "Declares that any compulsory license granted by the Controller has the same legal force as a voluntary contract signed directly between the patent owner and the licensee.",
      example: "Once the Controller issues a compulsory license order to a manufacturer, the manufacturer can begin operations. The patent owner cannot block them by claiming there is no signed agreement."
    },
    "94": {
      title: "Termination of compulsory licence",
      text: "Allows the patentee to request the termination of a compulsory license if the circumstances that led to it (like a shortage or high prices) have completely ceased to exist.",
      example: "If a pharmaceutical patent owner drops their drug price to an extremely low rate and builds a massive factory in India, they can ask to cancel the compulsory license given to a rival."
    },
    "95": {
      title: "Omitted",
      text: "This section was deleted during statutory updates.",
      example: "Historical provision. Previously dealt with specific operational terms of compulsory licensing under older industrial rules."
    },
    "96": {
      title: "Omitted",
      text: "This section was deleted during statutory updates.",
      example: "Historical provision. Previously dealt with licensing of related patents under older, pre-WTO frameworks."
    },
    "97": {
      title: "Omitted",
      text: "This section was deleted during statutory updates.",
      example: "Historical provision. Previously dealt with special provisions for licensing in the food and medicine sectors."
    },
    "98": {
      title: "Omitted",
      text: "This section was deleted during statutory updates.",
      example: "Historical provision. Previously dealt with licensing terms and conditions."
    },
    "99": {
      title: "Meaning of use of invention for purposes of Government",
      text: "Defines 'government use' as the making, using, or importing of any patented invention by any department of the government or authorized contractors for state purposes.",
      example: "If the military instructs a defense contractor to manufacture a patented radio transmitter for army use, this action falls under 'government use'."
    },
    "100": {
      title: "Power of Central Government to use inventions for purposes of Government",
      text: "Empowers the Central Government and its authorized agents to use any patented invention for official purposes, provided they pay a reasonable royalty to the patentee.",
      example: "The Ministry of Health can authorize public labs to use a patented diagnostic tool to run mass public health screenings, provided they pay the patentee a government-approved royalty."
    },
    "101": {
      title: "Rights of third parties in respect of use of invention for purposes of Government",
      text: "Protects third-party manufacturers who have exclusive licensing deals with patentees from losing their business when the government exercises its right to use the patent.",
      example: "If you have an exclusive license to make patented water pumps, and the government takes over production, Section 101 ensures your licensing rights and royalties are accounted for."
    },
    "102": {
      title: "Acquisition of inventions and patents by the Central Government",
      text: "Allows the Central Government to completely acquire and take ownership of a patent or invention in the public interest, paying mutually agreed compensation to the inventor.",
      example: "If an inventor designs a revolutionary national defense radar, the government can legally buy out the patent entirely, making it state property and keeping it out of commercial hands."
    },
    "103": {
      title: "Reference to High Court of disputes as to use for purposes of Government",
      text: "States that if the government and the patent owner cannot agree on fair compensation or royalty rates for government use, the dispute will be referred to the High Court.",
      example: "If the government uses your patented solar technology and offers 1 lakh in royalties, but you believe you deserve 10 lakhs, you can file a petition in the High Court to settle the amount."
    },
    "104": {
      title: "Jurisdiction",
      text: "Declares that no patent infringement lawsuit can be filed in any court lower than a District Court. If the defendant files a counterclaim to revoke the patent, the suit is automatically transferred to the High Court.",
      example: "You cannot sue someone for patent infringement in a local consumer court or magistrate court; you must file the lawsuit in a District Court or go directly to the High Court."
    },
    "104A": {
      title: "Burden of proof in case of suits concerning infringement",
      text: "States that in a lawsuit involving a patented process for making a new product, the burden of proof shifts to the defendant to show they used a different process to make the identical product.",
      example: "If you patent a process for making a rare chemical, and a competitor start selling that identical chemical, they must prove in court they did not use your patented recipe to make it."
    },
    "105": {
      title: "Power of court to make declaration as to non-infringement",
      text: "Allows a manufacturer to apply to court for a formal declaration that their proposed product or process does not infringe on a specific existing patent.",
      example: "Before launching a new engine design, a company can ask the court to declare that their design is distinct and does not infringe on a competitor's active motor patent."
    },
    "106": {
      title: "Power of court to grant relief in cases of groundless threats of infringement proceedings",
      text: "Protects businesses from being bullied with fake patent lawsuits. If someone threatens you with infringement without a valid patent, you can sue them for damages and get an injunction.",
      example: "A competitor sends threatening letters to your distributors claiming your products infringe their patent. If their patent is invalid or non-existent, you can sue them to stop the threats."
    },
    "107": {
      title: "Defences, etc., in suit for infringement",
      text: "Outlines all valid defenses you can use if sued for patent infringement, including arguing that the patent should never have been granted because it is not novel or falls under Section 3.",
      example: "If a company sues you for copying their software patent, your defense under Section 107 can be that software is not patentable in India, making their patent invalid."
    },
    "107A": {
      title: "Certain acts not to be considered as infringement",
      text: "The 'Bolar Provision'. Importing or making patented drugs for clinical trials and regulatory approval before the patent expires does not count as infringement.",
      example: "An Indian pharma firm can manufacture and test generic versions of a patented drug 2 years before the patent expires to get regulatory approval ready for launch on day one of patent expiry."
    },
    "108": {
      title: "Reliefs in suits for infringement",
      text: "Lists the solutions a court can grant if you win an infringement lawsuit, including permanent injunctions (stopping the rival), damages, or an accounting of the infringer's profits.",
      example: "If you win your lawsuit against an infringer, the court will order them to stop selling the product, destroy their stock, and pay you the profits they made on those sales."
    },
    "109": {
      title: "Right of exclusive licensee to take proceedings against infringement",
      text: "Gives an exclusive licensee (someone who bought the sole rights to sell the patented item) the right to file an infringement lawsuit in their own name.",
      example: "If you are the exclusive distributor of a German medical device patent in India, you can sue local bootleggers directly without needing the German parent company to join the suit."
    },
    "110": {
      title: "Right of licensee under section 84 to take proceedings against infringement",
      text: "Permits a manufacturer who was granted a compulsory license under Section 84 to sue third-party infringers if the original patent owner refuses to take legal action.",
      example: "If you got a compulsory license to make generic cancer drugs and a rival start selling unauthorized copies, you can sue them if the original patent owner refuses to do so."
    },
    "111": {
      title: "Restriction on power of court to grant damages or account of profits for infringement",
      text: "Limits the court from awarding financial damages if the infringer proves they had no reasonable way of knowing that the patent existed.",
      example: "If you fail to mark your commercial products with the word 'Patented' and a patent number, a court may refuse to award you damages because the infringer was unaware of your patent."
    },
    "112": {
      title: "Omitted",
      text: "This section was deleted during statutory streamlining of judicial proceedings.",
      example: "Historical provision. Previously dealt with court powers regarding the restriction of patent use."
    },
    "113": {
      title: "Certificate of validity of specification and costs of subsequent suits for infringement thereof",
      text: "States that if a court upholds a patent's validity during a lawsuit, they can issue a certificate of validity, making it easier for the patentee to recover full legal costs in future lawsuits.",
      example: "Once your patent passes a tough court challenge, the judge issues a Section 113 certificate. If anyone else infringes your patent, they will have to pay double your legal fees if they lose."
    },
    "114": {
      title: "Relief for infringement of partially valid specification",
      text: "Declares that if a patent has multiple claims and some are found invalid, the court can still grant damages for the infringement of the remaining valid claims.",
      example: "If your patent has 5 claims and a court finds claims 1-3 are invalid but claims 4-5 are perfectly valid, you can still win damages for infringement of claims 4 and 5."
    },
    "115": {
      title: "Scientific advisers",
      text: "Allows the court to appoint independent scientific experts to assist the judge in understanding complex technical details and evidence during patent trials.",
      example: "In a complicated biotechnology patent lawsuit, the judge appoints an independent university geneticist to explain how the gene-editing process works."
    },
    "116": {
      title: "Omitted",
      text: "This section was deleted during the restructuring of intellectual property tribunals.",
      example: "Historical provision. Previously dealt with administrative details of appellate tribunals."
    },
    "117": {
      title: "Omitted",
      text: "This section was deleted during tribunal reform updates.",
      example: "Historical provision. Previously dealt with staff and administrative parameters of the Intellectual Property Appellate Board (IPAB)."
    },
    "117A": {
      title: "Appeals to High Court",
      text: "Declares that any appeal against decisions, orders, or directions of the Controller General must be filed directly with the High Court.",
      example: "If the Controller rejects your patent application under Section 15, you can appeal this rejection by filing a petition in the High Court within the set timeline."
    },
    "117B": {
      title: "Omitted",
      text: "This section was deleted during the 2021 tribunal reforms, transferring powers to the High Court.",
      example: "Historical provision. Previously dealt with procedures of the IPAB."
    },
    "117C": {
      title: "Omitted",
      text: "This section was deleted during tribunal reforms.",
      example: "Historical provision. Previously dealt with transfer of cases."
    },
    "117D": {
      title: "Omitted",
      text: "This section was deleted during tribunal reforms.",
      example: "Historical provision. Previously dealt with the timelines for filing appeals."
    },
    "117E": {
      title: "Appearance of Controller in legal proceedings",
      text: "Gives the Controller the right to appear and be heard in appeals before the High Court to explain the reasoning behind their decisions.",
      example: "If you appeal a patent rejection, the Controller can send a legal representative to the High Court to explain why they believed your chemical compound lacked an inventive step."
    },
    "117F": {
      title: "Omitted",
      text: "Deleted during tribunal reforms.",
      example: "Historical provision. Previously dealt with the power of the IPAB to make rules."
    },
    "117G": {
      title: "Omitted",
      text: "Deleted during tribunal reforms.",
      example: "Historical provision. Previously dealt with transfer of pending cases to the Board."
    },
    "117H": {
      title: "Omitted",
      text: "Deleted during tribunal reforms.",
      example: "Historical provision. Previously dealt with membership qualifications of the IPAB."
    },
    "118": {
      title: "Contravention of Secrecy provisions relating to certain inventions",
      text: "Imposes strict criminal penalties, including imprisonment up to 2 years and/or fines, if an applicant violates national security secrecy directions.",
      example: "If an inventor leaks blueprints of a military missile tracking system that was placed under secrecy, they can be arrested and sentenced to prison."
    },
    "119": {
      title: "Omitted",
      text: "This section was deleted during statutory updates.",
      example: "Historical provision. Previously dealt with administrative punishments for specific document falsification."
    },
    "120": {
      title: "Unauthorised claim of patent rights",
      text: "Imposes a heavy fine on anyone who falsely sells a product claiming it is patented in India when it actually is not.",
      example: "If you print 'Patented in India' on your water bottles but have never applied for or been granted a patent, you can be fined up to 1 lakh rupees for misleading the public."
    },
    "121": {
      title: "Omitted",
      text: "This section was deleted during statutory updates.",
      example: "Historical provision. Previously dealt with falsification of entries in the register."
    },
    "122": {
      title: "Refusal or failure to supply information",
      text: "Imposes major financial penalties if a patentee refuses or fails to submit annual commercial reports showing how much they are manufacturing their patent in India.",
      example: "If you ignore the Patent Office's request for commercial working details (Form 27) for three consecutive years, you can face major regulatory fines."
    },
    "123": {
      title: "Practice by non-registered patent agents",
      text: "Forbids anyone who is not a registered Patent Agent from practicing law, drafting patent documents, or representing clients before the Patent Office.",
      example: "An unregistered consultant who charges fees to draft patent specifications for inventors can be prosecuted and fined for unauthorized legal practice."
    },
    "124": {
      title: "Offences by companies",

  // Navigation & Login Logic
  function handleLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const error = document.getElementById('loginError');
    
    if (username === 'admin' && password === 'admin123') {
      document.getElementById('loginPage').classList.add('hidden');
      document.getElementById('searchPage').classList.remove('hidden');
      error.textContent = '';
    } else {
      error.textContent = '❌ Invalid username or password';
    }
  }

  function goToLogin() {
    document.getElementById('searchPage').classList.add('hidden');
    document.getElementById('loginPage').classList.remove('hidden');
  }

  function resetSearch() {
    document.getElementById('sectionInput').value = '';
    document.getElementById('keywordInput').value = '';
    document.getElementById('searchResultBox').innerHTML = '<span style="color: #64748b;">Awaiting query execution. Enter a targeted section or key phrase above to generate clean explanations and examples.</span>';
  }

  // Helper function to build paragraph layout with Examples
  function formatLegalText(sectionNum, title, plainText, exampleText, highlightKeyword = '') {
    let styledText = plainText;
    let styledExample = exampleText;

    if (highlightKeyword) {
      const regex = new RegExp(`(${highlightKeyword})`, 'gi');
      styledText = plainText.replace(regex, '<mark style="background-color: var(--highlight-color); color: #000;">$1</mark>');
      styledExample = exampleText.replace(regex, '<mark style="background-color: var(--highlight-color); color: #000;">$1</mark>');
    }

    return `
      <div class="legal-item">
        <span class="badge">Section ${sectionNum}</span>
        <h3 class="section-title">${title}</h3>
        <div class="section-text">${styledText}</div>
        <div class="example-box">
          <div class="example-title">💡 Real-World Example:</div>
          <div>${styledExample}</div>
        </div>
      </div>
    `;
  }

  // Search Logic
  function showSearchResult() {
    const section = document.getElementById('sectionInput').value.trim();
    const keyword = document.getElementById('keywordInput').value.trim().toLowerCase();
    const resultBox = document.getElementById('searchResultBox');

    resultBox.innerHTML = '';

    if (section && keyword) {
      resultBox.innerHTML = '<span style="color: #ef4444; font-weight: bold;">⚠️ Please search using only one field: Section OR Keyword.</span>';
      return;
    }

    if (section) {
      if (patentActData[section]) {
        const entry = patentActData[section];
        resultBox.innerHTML = formatLegalText(section, entry.title, entry.text, entry.example);
      } else {
        resultBox.innerHTML = '❌ No formal legal records found matching that statutory section number (Range: 1 to 163).';
      }
    } else if (keyword) {
      let combinedHTML = '';
      let matchCount = 0;

      for (let key in patentActData) {
        const entry = patentActData[key];
        const titleMatch = entry.title.toLowerCase().includes(keyword);
        const textMatch = entry.text.toLowerCase().includes(keyword);
        const exampleMatch = entry.example.toLowerCase().includes(keyword);

        if (titleMatch || textMatch || exampleMatch) {
          combinedHTML += formatLegalText(key, entry.title, entry.text, entry.example, keyword);
          matchCount++;
        }
      }
      resultBox.innerHTML = combinedHTML || `❌ No matching legal clauses or references found for the keyword: "${keyword}".`;
    } else {
      resultBox.innerHTML = 'ℹ️ Please enter either a target section number or an explicit keyword phrase.';
    }
  }
</script>
